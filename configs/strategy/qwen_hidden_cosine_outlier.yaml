strategy: qwen_hidden_cosine_outlier
model: Qwen/Qwen2.5-1.5B
dataset: wikitext
dataset_config: wikitext-2-raw-v1
split: test
max_samples: 512
seq_len: 512
batch_size: 1
dtype: fp16
pruning_ratio: 0.1
score: hidden_cosine
score_cache: null
score_max_batches: 16
selection_objective: score
outlier_metric: outlier_ratio
outlier_weight: 0.25
pruning_mode: depth_width_physical
unit_score: hvp
unit_pruning_ratio: 0.1
unit_score_max_batches: 1
unit_hvp_k_horizon: 1
memory_weight: 0.25
preservation_max_batches: 16
inference_prompt: The future of artificial intelligence is
inference_max_new_tokens: 32
export_pruned_model: true
output_root: exp/runs
seed: 42
